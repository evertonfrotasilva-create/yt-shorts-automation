name: Daily YT Short

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 BRT
  workflow_dispatch:

# Permissão padrão: somente leitura
# Cada job eleva apenas o que precisa
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: '3.11'

# ── JOB 1: Validação ──────────────────────────────────────────────────────────
# Roda rápido (sem ffmpeg, sem API calls reais) para garantir que:
#  - nenhuma dependência tem vulnerabilidade conhecida
#  - a fila de hoje existe e tem narração preenchida
#  - o código importa sem erros
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Auditoria de segurança (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off || true
        # || true: reporta vulnerabilidades mas não bloqueia produção
        # Remova o "|| true" quando quiser bloquear em vulnerabilidades críticas

      - name: Dry-run — validar fila de hoje
        env:
          ELEVENLABS_API_KEY:    ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OUTPUT_DIR:            /tmp/yt-outputs
        run: python daily_auto.py --dry-run

# ── JOB 2: Produção ───────────────────────────────────────────────────────────
# Só roda se a validação passar. Eleva para contents: write apenas aqui,
# onde o commit da fila atualizada é necessário.
  produce:
    name: Produce & Upload
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write   # para commitar queue/ de volta
      issues: write     # para abrir issue em caso de falha

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: ffmpeg e fontes
        run: sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        env:
          ELEVENLABS_API_KEY:    ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OUTPUT_DIR:            /tmp/yt-outputs
        run: python daily_auto.py

      - name: Salvar vídeo como artefato
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: /tmp/yt-outputs/**/final_video.mp4
          retention-days: 7

      - name: Salvar fila atualizada no repo
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git
          git pull --rebase origin master || true
          git add queue/
          git diff --staged --quiet || git commit -m "auto: queue $(date +%Y-%m-%d)"
          for i in 1 2 3; do git push && break; git pull --rebase origin master || true; done

      # Notificação de falha: abre uma issue no repo com link para o log
      - name: Notificar falha
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "[FALHA] Pipeline diario -- $(date +%Y-%m-%d)" \
            --body "Producao automatica falhou. Log: ${RUN_URL}" \
            --repo "${{ github.repository }}" || true
