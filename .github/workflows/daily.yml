name: Daily YT Short

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 BRT (UTC-3)
  workflow_dispatch:        # permite rodar manualmente no GitHub

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  produce:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # necessário para commitar o JSON da fila atualizado

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: ffmpeg e fontes
        run: sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu

      - name: Dependencias Python
        run: pip install -r requirements.txt

      - name: Rodar pipeline
        env:
          ELEVENLABS_API_KEY:    ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY:        ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OUTPUT_DIR:            /tmp/yt-outputs
        run: python daily_auto.py

      - name: Salvar fila atualizada no repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/
          git diff --staged --quiet || git commit -m "auto: queue $(date +%Y-%m-%d)"
          git push
